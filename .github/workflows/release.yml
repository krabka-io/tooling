# Publishes the AXL module as a GitHub release asset.
#
# A consumer pins the module with `axl_archive_dep`. A GitHub release asset is a
# fixed file, so its digest does not change. The asset also downloads in places
# where `github.com/<owner>/<repo>/archive/...` is blocked, for example in a
# Claude Code cloud sandbox that does not have this repository attached.
#
# To cut a release, push a tag `vX.Y.Z` on a commit of `main`:
#
#   git tag v0.1.0 origin/main
#   git push origin v0.1.0
#
# The workflow then creates release `v0.1.0` with these assets:
#
#   tooling-0.1.0.tar.gz         the module tree under the prefix `tooling-0.1.0/`
#   tooling-0.1.0.tar.gz.sha512  the `integrity` value for `axl_archive_dep`
#
# The release notes hold the `axl_archive_dep` block to paste into a consumer.
# CI calls the same archive validation before its required gate. Only a tag
# run can publish a release, in a separate job with write permission.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  axl-module:
    uses: ./.github/workflows/module-archive.yml

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: axl-module
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: axl-module
          path: dist

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.axl-module.outputs.tag }}
          PREFIX: ${{ needs.axl-module.outputs.prefix }}
          ASSET: ${{ needs.axl-module.outputs.asset }}
        run: |
          set -euo pipefail
          integrity="$(cat "dist/${ASSET}.sha512")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          The AXL module of this repository at ${TAG} (commit ${GITHUB_SHA}).

          Write this block in the \`MODULE.aspect\` of a consumer:

          \`\`\`python
          axl_archive_dep(
              name = "krabka_tooling",
              urls = ["${url}"],
              integrity = "${integrity}",
              strip_prefix = "${PREFIX}",
              auto_use_tasks = True,
              dev = True,
          )
          \`\`\`
          EOF
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            "dist/${ASSET}" "dist/${ASSET}.sha512"
