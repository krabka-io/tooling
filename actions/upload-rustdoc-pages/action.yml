name: Upload rustdoc Pages
description: Stage public rustdoc files and linked hidden source pages, then verify the Pages archive.
inputs:
  path:
    description: Assembled rustdoc site, relative to the caller working directory or absolute.
    required: true
  site-url:
    description: Public URL of the archive root, including the deployment prefix.
    default: https://pages.invalid/
  component-archives:
    description: Optional JSON file with site_url and archive entries for cross-component checks.
    default: ''
  render-pages:
    description: Optional JSON file listing archive-relative pages for installed Playwright Chromium checks.
    default: ''
  composition-lock:
    description: Optional pinned full-site archive lock; requires component-id. Replaces the standalone link check with full graph validation.
    default: ''
  component-id:
    description: Component replaced by this build in composition-lock; requires composition-lock.
    default: ''
  candidate-head-sha:
    description: Candidate commit override; defaults to the pull request head SHA or workflow SHA.
    default: ''
outputs:
  link-report:
    description: JSON archive link report on the runner.
    value: ${{ steps.stage.outputs.report }}
runs:
  using: composite
  steps:
    - name: Stage public docs and linked source pages
      id: stage
      shell: bash
      env:
        SITE_PATH: ${{ inputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        staging_root="$(mktemp -d "${RUNNER_TEMP}/rustdoc-pages.XXXXXX")"
        python3 "${ACTION_PATH}/pages_site.py" stage "${SITE_PATH}" "${staging_root}/site"
        echo "path=${staging_root}/site" >> "${GITHUB_OUTPUT}"
        echo "report=${staging_root}/links.json" >> "${GITHUB_OUTPUT}"

    - name: Upload the validated staging tree
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ steps.stage.outputs.path }}
        # Never enable this on the checkout or raw build output.
        include-hidden-files: true

    - name: Verify the final Pages archive
      shell: bash
      env:
        STAGED_PATH: ${{ steps.stage.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/pages_site.py" verify "${STAGED_PATH}" "${RUNNER_TEMP}/artifact.tar"

    - name: Check links in the final Pages archive
      shell: bash
      env:
        STAGED_PATH: ${{ steps.stage.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        SITE_URL: ${{ inputs.site-url }}
        COMPONENT_ARCHIVES: ${{ inputs.component-archives }}
        RENDER_PAGES: ${{ inputs.render-pages }}
        LINK_REPORT: ${{ steps.stage.outputs.report }}
        COMPOSITION_LOCK: ${{ inputs.composition-lock }}
        COMPONENT_ID: ${{ inputs.component-id }}
        CANDIDATE_SHA: ${{ inputs.candidate-head-sha || github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ -n "${COMPOSITION_LOCK}" || -n "${COMPONENT_ID}" ]]; then
          if [[ -z "${COMPOSITION_LOCK}" || -z "${COMPONENT_ID}" || -n "${COMPONENT_ARCHIVES}" || -n "${RENDER_PAGES}" ]]; then
            python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        Path(os.environ['LINK_REPORT']).write_text(json.dumps({
            'status': 'failed', 'errors': ['composition-lock and component-id must be supplied together; composition lock owns component archives and render pages']}) + '\n')
        PYTHON
            exit 1
          fi
          candidate_path="${STAGED_PATH}/../candidate.json"
          export CANDIDATE_PATH="${candidate_path}"
          python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        Path(os.environ['CANDIDATE_PATH']).write_text(json.dumps({
            'id': os.environ['COMPONENT_ID'],
            'archive': str(Path(os.environ['RUNNER_TEMP']) / 'artifact.tar'),
            'repo': os.environ['GITHUB_REPOSITORY'],
            'head_sha': os.environ['CANDIDATE_SHA'],
            'run_id': int(os.environ['GITHUB_RUN_ID'])}) + '\n')
        PYTHON
          python3 "${ACTION_PATH}/../validate-composed-pages/compose.py" \
            --manifest "${COMPOSITION_LOCK}" --candidate "${candidate_path}" \
            --report "${LINK_REPORT}" --work-dir "${RUNNER_TEMP}"
          exit 0
        fi
        options=(--site-url "${SITE_URL}" --report "${LINK_REPORT}")
        if [[ -n "${COMPONENT_ARCHIVES}" ]]; then
          options+=(--components "${COMPONENT_ARCHIVES}")
        fi
        if [[ -n "${RENDER_PAGES}" ]]; then
          options+=(--render-pages "${RENDER_PAGES}")
        fi
        python3 "${ACTION_PATH}/archive_links.py" "${RUNNER_TEMP}/artifact.tar" "${options[@]}"
