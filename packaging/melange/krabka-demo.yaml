package:
  name: krabka-demo
  version: 0.3.8
  epoch: 0
  description: All-in-one Krabka observability demo image payload
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - ca-certificates-bundle
      - build-base
      - busybox
      - cmake
      - git
      - rustup

# The observability demo intentionally ships one convenience package containing
# every binary used by docker-compose.yml. Krabka service binaries are built
# with heap profiling enabled so their /debug/pprof/heap endpoints exist; the
# demo app is built separately without heap-profiling because its dependency
# graph already owns a global allocator, and krabka-gres because it defines no
# such feature (it exposes no admin port to serve a heap profile from).
pipeline:
  - name: Install pinned Rust toolchain
    runs: |
      rustup-init -y --default-toolchain none --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"
      rustup toolchain install 1.97.0 --component cargo --profile minimal
      rustup default 1.97.0

  - name: Build observability demo binaries
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      cache=/var/cache/melange
      if mkdir -p "$cache/cargo" 2>/dev/null && [ -w "$cache" ]; then
        export CARGO_HOME="$cache/cargo"
        export CARGO_TARGET_DIR="$cache/target"
        target="$cache/target"
      else
        target="target"
      fi

      cargo build --release \
        -p krabka-broker \
        -p krabka-metrics \
        -p krabka-metrics-service \
        -p krabka-traces \
        -p krabka-observability \
        -p krabka-profiles \
        -p krabka-schema-registry \
        --features heap-profiling

      cargo build --release \
        -p krabka-cli \
        -p krabka-gres \
        -p observability-demo-app

      mkdir -p dist
      for bin in krabka-broker krabka krabka-metrics krabka-metrics-service \
                 krabka-traces krabka-observability krabka-profiles \
                 krabka-schema-registry krabka-gres observability-demo-app; do
        install -m 0755 "$target/release/$bin" "dist/$bin"
      done
      strip --strip-debug dist/*

  - name: Install demo binaries
    runs: |
      for bin in krabka-broker krabka krabka-metrics krabka-metrics-service \
                 krabka-traces krabka-observability krabka-profiles \
                 krabka-schema-registry krabka-gres observability-demo-app; do
        install -D -m 0755 "dist/$bin" "${{targets.destdir}}/usr/bin/$bin"
      done
